version: "2"
linters:
  default: none
  enable: [kubeapilinter]
  settings:
    custom:
      kubeapilinter:
        type: module
        description: Kube API Linter
        settings:
          linters:
            disable: ["*"]
            enable:
              - conditions
              - defaultorrequired
              - duplicatemarkers
              - integers
              - jsontags
              - nofloats
              - nomaps
              - optionalorrequired
              - ssatags
              - statusoptional
              - statussubresource
              - uniquemarkers
          lintersConfig:
            conditions:
              useProtobuf: Ignore
              usePatchStrategy: Ignore
  exclusions:
    generated: strict
    rules:
      - linters: [kubeapilinter]
        path-except: "api/.*"
