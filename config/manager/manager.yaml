apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: podpools
    app.kubernetes.io/managed-by: kustomize
    # The controller meets the restricted Pod Security Standard, so enforce it
    # on its own namespace: a workload that regresses below restricted is
    # rejected here rather than admitted. warn surfaces the same at apply time.
    # To opt out, remove these labels (or patch them in an overlay).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: podpools
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: podpools
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: podpools
    spec:
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        # 65532 is distroless's nonroot user -- the UID the image already runs
        # as. Stating it here is explicit (and high enough to avoid colliding
        # with a host user), rather than leaving it to the image's USER line.
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # 128Mi is provisional. The label-scoped, stripped cache keeps growth
        # bounded to managed children, but a fleet of pools naming many workload
        # GVKs still adds one informer each; revisit at scale.
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      # Must exceed the manager's GracefulShutdownTimeout (30s) so the
      # process finishes draining before SIGKILL. LeaderElectionReleaseOnCancel
      # releases the lease at the end of shutdown; a premature SIGKILL skips
      # the release and failover waits out the full LeaseDuration.
      terminationGracePeriodSeconds: 60
