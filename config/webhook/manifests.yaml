---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-podpools-dev-v1alpha1-podpool
  failurePolicy: Fail
  name: mpodpool-v1alpha1.kb.io
  rules:
  - apiGroups:
    - podpools.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - podpools
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-podpools-dev-v1alpha1-podpool
  failurePolicy: Fail
  name: vpodpool-v1alpha1.kb.io
  rules:
  - apiGroups:
    - podpools.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - podpools
  sideEffects: None
