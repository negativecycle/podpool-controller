---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - podpools.dev
  resources:
  - podpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - podpools.dev
  resources:
  - podpools/finalizers
  verbs:
  - update
- apiGroups:
  - podpools.dev
  resources:
  - podpools/status
  verbs:
  - get
  - patch
  - update
