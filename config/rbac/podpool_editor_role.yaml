# This rule is not used by the project podpools itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the podpools.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: podpools
    app.kubernetes.io/managed-by: kustomize
  name: podpool-editor-role
rules:
- apiGroups:
  - podpools.dev
  resources:
  - podpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - podpools.dev
  resources:
  - podpools/status
  verbs:
  - get
