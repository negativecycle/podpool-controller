# [MANAGER]: Manager Deployment Configurations
controllerManager:
  replicas: 1
  container:
    image:
      repository: ghcr.io/negativecycle/podpool-controller
      # Blank falls back to the chart appVersion; override to pin a tag or digest.
      tag: ""
    imagePullPolicy: IfNotPresent
    args:
      - "--leader-elect"
      - "--metrics-bind-address=:8443"
      - "--health-probe-bind-address=:8081"
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      # Matches the kustomize source (config/manager). The helm plugin drops
      # this when it generates values; without it the chart ships a container
      # that can write its own root filesystem, which the source does not.
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - "ALL"
  securityContext:
    runAsNonRoot: true
    # Distroless's nonroot UID -- the one the image already runs as. Explicit,
    # and high enough to avoid a host-user collision. Matches config/manager.
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  serviceAccountName: podpools-controller-manager

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true

# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process.
  enable: true

  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true

# [WEBHOOKS]: Webhooks configuration
# The following configuration is automatically generated from the manifests
# generated by controller-gen. To update run 'make manifests' and
# the edit command with the '--force' flag
webhook:
  enable: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false

# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certmanager:
  enable: true

# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enable: false

# [POLICY]: Admission-time image verification (requires Kyverno in the cluster).
# Off by default: it depends on Kyverno being installed and, in Enforce mode,
# can block workloads. When enabled it installs a Kyverno ClusterPolicy that
# requires this controller's image to carry a cosign signature and a signed
# SLSA provenance attestation from the project's release workflow.
policy:
  kyverno:
    # Set true to install the verification ClusterPolicy.
    enabled: false
    # Audit reports violations without blocking; Enforce rejects images that
    # fail verification. Start with Audit, review the policy report, then Enforce.
    validationFailureAction: Audit

# [EXTRA OBJECTS]: Arbitrary manifests rendered alongside the chart, for things
# it does not model directly. Each entry is a full Kubernetes object and is run
# through `tpl`, so it may reference values and release metadata. For example, a
# PodDisruptionBudget for an HA (replicas > 1) deployment:
#
#   extraObjects:
#     - apiVersion: policy/v1
#       kind: PodDisruptionBudget
#       metadata:
#         name: '{{ include "chart.name" . }}-pdb'
#       spec:
#         minAvailable: 1
#         selector:
#           matchLabels:
#             control-plane: controller-manager
extraObjects: []

# [POD SECURITY]: Enforce a Pod Security Standard on the release namespace. On
# by default -- the controller meets "restricted". The chart renders the
# namespace to carry the labels, so with this enabled install WITHOUT
# --create-namespace. Disable to manage (and label) the namespace yourself.
podSecurityStandards:
  enabled: true
  # The level to enforce and warn on. "restricted" is the strictest; the
  # controller satisfies it. "baseline" is the looser profile.
  standard: restricted
