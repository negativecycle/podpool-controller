# [MANAGER]: Manager Deployment Configurations
controllerManager:
  replicas: 1
  container:
    image:
      repository: ghcr.io/negativecycle/podpool-controller
      # Blank falls back to the chart appVersion.
      tag: ""
      # Pin by digest (include the sha256: prefix), e.g.
      # "sha256:abc123...". When set it overrides tag entirely -- an immutable,
      # tamper-evident reference. Empty means use the tag above.
      digest: ""
    imagePullPolicy: IfNotPresent
    args:
      - "--leader-elect"
      - "--metrics-bind-address=:8443"
      - "--health-probe-bind-address=:8081"
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      # Matches the kustomize source (config/manager). The helm plugin drops
      # this when it generates values; without it the chart ships a container
      # that can write its own root filesystem, which the source does not.
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - "ALL"
  securityContext:
    runAsNonRoot: true
    # Distroless's nonroot UID -- the one the image already runs as. Explicit,
    # and high enough to avoid a host-user collision. Matches config/manager.
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  serviceAccountName: podpools-controller-manager

  # Pull secrets for a private registry mirror. The published image is public.
  imagePullSecrets: []
  # e.g. system-cluster-critical, so the controller is evicted last under
  # node pressure. Empty leaves it at the default priority.
  priorityClassName: ""
  # Standard scheduling escape hatches. Empty by default.
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Spread the controller's replicas across failure domains. These only bite at
  # replicas > 1 (a single replica has nothing to spread); at replicas: 1 they
  # are no-ops. The default requires one-per-node and tries one-per-zone:
  #   - hostname / DoNotSchedule: two replicas never share a node. On a cluster
  #     with fewer nodes than replicas this leaves the extra replicas Pending --
  #     that is the "require" you asked for; lower it to ScheduleAnyway or raise
  #     the node count.
  #   - zone / ScheduleAnyway: spread across zones when possible, but never block
  #     scheduling to achieve it.
  # matchLabelKeys pins each constraint to the current rollout (pod-template-hash),
  # so a rolling update's old and new pods are not counted together and cannot
  # deadlock the surge. Set to [] to drop the defaults entirely.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          control-plane: controller-manager
      matchLabelKeys:
        - pod-template-hash
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          control-plane: controller-manager
      matchLabelKeys:
        - pod-template-hash

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true

# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process.
  enable: true

  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true

# [WEBHOOKS]: Webhooks configuration
# The following configuration is automatically generated from the manifests
# generated by controller-gen. To update run 'make manifests' and
# the edit command with the '--force' flag
webhook:
  enable: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false

# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certmanager:
  enable: true

# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enable: false

# [POLICY]: Admission-time image verification (requires Kyverno in the cluster).
# Off by default: it depends on Kyverno being installed and, in Enforce mode,
# can block workloads. When enabled it installs a Kyverno ClusterPolicy that
# requires this controller's image to carry a cosign signature and a signed
# SLSA provenance attestation from the project's release workflow.
policy:
  kyverno:
    # Set true to install the verification ClusterPolicy.
    enabled: false
    # Audit reports violations without blocking; Enforce rejects images that
    # fail verification. Start with Audit, review the policy report, then Enforce.
    validationFailureAction: Audit

# [EXTRA OBJECTS]: Arbitrary manifests rendered alongside the chart, for things
# it does not model directly. Each entry is a full Kubernetes object and is run
# through `tpl`, so it may reference values and release metadata. For example, a
# ConfigMap the controller consumes, or a NetworkPolicy the chart does not model:
#
#   extraObjects:
#     - apiVersion: v1
#       kind: ConfigMap
#       metadata:
#         name: '{{ include "chart.name" . }}-extra'
#       data:
#         key: value
extraObjects: []

# [POD SECURITY]: Enforce a Pod Security Standard on the release namespace. On
# by default -- the controller meets "restricted". The chart renders the
# namespace to carry the labels, so with this enabled install WITHOUT
# --create-namespace. Disable to manage (and label) the namespace yourself.
podSecurityStandards:
  enabled: true
  # The level to enforce and warn on. "restricted" is the strictest; the
  # controller satisfies it. "baseline" is the looser profile.
  standard: restricted

# [POD DISRUPTION BUDGET]: Keep a minimum available during voluntary disruptions
# (node drains, upgrades). On by default, but only takes effect at replicas > 1
# -- a budget over a single replica would block node drains entirely, so the
# chart does not render one there. Set minAvailable OR maxUnavailable, not both;
# either accepts a count or a percentage ("50%").
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""
