{{- if .Values.rbac.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: aggregate-manager-role
aggregationRule:
  clusterRoleSelectors:
  - matchLabels:
      podpools.dev/aggregate-to-manager: "true"
rules: []
{{- end -}}
