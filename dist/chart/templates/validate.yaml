{{- /*
Fail fast on a values combination this chart cannot make work. The webhook's
serving certificate is provisioned by cert-manager (the MutatingWebhookConfiguration
carries cert-manager's inject-ca-from annotation and there is no other cert
source here), so the webhook without cert-manager is a webhook with no cert.
This is a pure values check -- offline-safe, so lint/template/scan are unaffected.
The other half of the requirement, that cert-manager is actually installed in
the cluster, cannot be checked at render time without breaking offline tooling;
NOTES.txt and the docs carry that.
*/ -}}
{{- if and .Values.webhook.enable (not .Values.certmanager.enable) }}
{{- fail "\nwebhook.enable=true requires certmanager.enable=true: the webhook's serving certificate is provisioned by cert-manager, and with it off the webhook has no cert and will fail.\nEnable cert-manager (and make sure it is installed in the cluster), or disable the webhook.\n" }}
{{- end }}
