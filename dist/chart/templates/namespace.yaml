{{- if .Values.podSecurityStandards.enabled }}
# The chart renders the release namespace itself so it can carry the Pod
# Security Standard labels -- Helm cannot label a namespace it does not own.
# Because of that, install WITHOUT --create-namespace (Helm would create an
# unlabelled one first and this object would then collide with it). Disable with
# podSecurityStandards.enabled=false to manage the namespace yourself.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    # The controller meets restricted; enforce it so a regressed workload is
    # rejected here, and warn so the same shows at apply time.
    pod-security.kubernetes.io/enforce: {{ .Values.podSecurityStandards.standard }}
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: {{ .Values.podSecurityStandards.standard }}
    pod-security.kubernetes.io/warn-version: latest
{{- end }}
