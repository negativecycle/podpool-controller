name: Security

on:
  workflow_call:
  # Weekly, so newly disclosed CVEs surface without waiting for a push.
  schedule:
    - cron: '0 6 * * 1'

permissions: {}

jobs:
  govulncheck:
    permissions:
      contents: read
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: make vulncheck

  dockerfile-scan:
    permissions:
      contents: read
    name: Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Backstops the pre-commit hook, which is local, skippable, and silently
      # skips when hadolint is not installed. This action bundles hadolint
      # v2.15.0, matching what the hook runs, so findings do not diverge.
      - name: Run hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true
          # hadolint's own default, and therefore what the hook enforces.
          failure-threshold: info

  image-scan:
    permissions:
      contents: read
    name: Container image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the manager image
        run: make docker-build IMG=podpools:scan

      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: podpools:scan
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          # Unfixed CVEs are not actionable — fail only on ones we can remediate.
          ignore-unfixed: true
