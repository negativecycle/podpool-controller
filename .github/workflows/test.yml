name: Tests

on:
  pull_request:
    # A docs change cannot alter a test outcome. .github is deliberately NOT
    # ignored: `make test` runs the ci suite that validates the workflows
    # themselves (actionlint, SHA pinning), so a workflow edit must run it.
    paths-ignore:
      - 'docs/**'
      - '**.md'

# A force-push supersedes the run it interrupted; without this the obsolete
# one keeps a runner busy to no purpose.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cache the tool binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            tools-${{ runner.os }}-

      - name: Running Tests
        run: make test
