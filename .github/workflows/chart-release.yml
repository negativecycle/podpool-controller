name: Chart Release

# Publish the Helm chart as a signed OCI artifact on a release tag. It goes to
# ghcr.io/<owner>/charts/<chart> -- a path distinct from the image at
# ghcr.io/<owner>/podpool-controller, so the two never collide.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Chart/app version to publish (e.g. 0.1.2). Defaults to the tag.
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  publish:
    name: Package, push, sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Push the chart artifact to ghcr.
      packages: write
      # Keyless signing and the provenance attestation mint an OIDC token.
      id-token: write
      attestations: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The chart version and app version both follow the release tag, so an
      # install of chart X.Y.Z deploys image X.Y.Z -- one number to reason about.
      - name: Resolve the version and registry
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION#v}"
          elif printf '%s' "${GITHUB_REF}" | grep -q '^refs/tags/v'; then
            version="${GITHUB_REF_NAME#v}"
          else
            echo "::error::no version: run on a v* tag or pass the version input"; exit 1
          fi
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          {
            echo "version=$version"
            echo "registry=oci://ghcr.io/${owner}/charts"
            echo "ref=ghcr.io/${owner}/charts/podpool-controller"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin

      # Capture the pushed digest so the signature and attestation bind to the
      # exact artifact, not a tag that could later move.
      - name: Package and push
        id: push
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REGISTRY: ${{ steps.v.outputs.registry }}
        run: |
          set -euo pipefail
          helm package dist/chart --version "$VERSION" --app-version "$VERSION" --destination .
          out=$(helm push "podpool-controller-${VERSION}.tgz" "$REGISTRY" 2>&1)
          echo "$out"
          digest=$(printf '%s\n' "$out" | awk '/[Dd]igest:/ {print $2}')
          if [ -z "$digest" ]; then echo "::error::could not read pushed digest"; exit 1; fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the chart
        env:
          REF: ${{ steps.v.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REF}@${DIGEST}"

      - name: Attest the chart provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.v.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Read both back, so a signature or attestation that did not land fails the
      # run rather than shipping unverifiable.
      - name: Verify signature and attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.v.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify "${REF}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          gh attestation verify "oci://${REF}@${DIGEST}" --repo "${GITHUB_REPOSITORY}" > /dev/null
