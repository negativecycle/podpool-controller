name: Chart

on:
  pull_request:
    paths:
      - 'dist/chart/**'
      - '.github/workflows/test-chart.yml'
  workflow_dispatch:

# A force-push supersedes the run it interrupted; without this the obsolete
# one keeps a runner busy to no purpose.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint and template
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7

      - name: Lint the chart
        run: helm lint dist/chart

      # Rendering with the defaults, then again with the opt-in policy on, is
      # what catches a template that only breaks in the path nobody renders by
      # hand. --debug fails the step on any template error rather than printing
      # it and moving on.
      - name: Render the chart
        run: |
          helm template pp dist/chart --debug > /dev/null
          helm template pp dist/chart --debug \
            --set policy.kyverno.enabled=true \
            --set policy.kyverno.validationFailureAction=Enforce > /dev/null

      # helm lint checks the templating; it does not check that the rendered
      # objects are valid Kubernetes. kubeconform validates them against the API
      # schemas -- a wrong apiVersion or a mistyped field that renders cleanly is
      # caught here. The full render (HA replicas, policy on) exercises the PDB
      # and ClusterPolicy paths too; -ignore-missing-schemas skips the CRs
      # kubeconform has no schema for (cert-manager, Kyverno).
      - name: Validate rendered manifests against the Kubernetes schemas
        run: |
          set -euo pipefail
          helm template pp dist/chart \
            --set manager.replicas=2 \
            --set policy.kyverno.enabled=true \
            | kubeconform -strict -ignore-missing-schemas -summary \
                -kubernetes-version 1.31.0

      # The rendered policy must actually be a ClusterPolicy when enabled, and
      # actually absent when not -- a gate that renders nothing still "passes".
      - name: Assert the policy toggles
        run: |
          set -euo pipefail
          if helm template pp dist/chart | grep -q 'kind: ClusterPolicy'; then
            echo "::error::policy rendered while disabled by default"
            exit 1
          fi
          if ! helm template pp dist/chart --set policy.kyverno.enabled=true | grep -q 'kind: ClusterPolicy'; then
            echo "::error::policy did not render when enabled"
            exit 1
          fi

      # trivy renders the chart itself and scans the manifests for
      # misconfigurations. HIGH and CRITICAL fail the run; the lower-severity
      # findings that remain are the controller's own required RBAC and
      # registry/pull-policy opinions, which are reviewed, not blocked.
      - name: Scan the chart for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: dist/chart
          severity: HIGH,CRITICAL
          exit-code: '1'
