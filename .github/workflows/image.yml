name: Image

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# A force-push supersedes the run it interrupted; without this the obsolete
# one keeps a runner busy to no purpose.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    # Two architectures to build, then on a release run: sign, scan for the
    # SBOM, two attestations pushed to the registry, and two verifies. 20 left
    # no margin for the registry round-trips.
    timeout-minutes: 30
    permissions:
      # write, not read: this job owns the release it announces.
      contents: write
      # Only meaningful on the push path; a pull_request run never authenticates.
      packages: write
      # Keyless signing and the provenance attestation both mint an OIDC token.
      id-token: write
      attestations: write
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # A pull request builds and stops. Nothing is pushed, so nothing is
      # logged into, and a fork's run cannot reach the registry at all.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fills created, revision, version, source, title, description, licenses
      # and url from repository metadata and the triggering ref, and emits them
      # as both labels and annotations.
      - name: Derive tags and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Annotate the index as well as the manifest. The default is
          # manifest only, and ghcr reads the index -- so the default leaves
          # the package showing nothing and linked to nothing, which is the
          # exact failure passing `annotations:` is supposed to prevent.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # arm64 as well as amd64: clusters run on both, and the binary is a
          # pure-Go cross-compile (CGO_ENABLED=0), so buildx builds each arch
          # natively on the amd64 runner with no QEMU emulation to slow it down.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The line most people miss. Labels land on the image config;
          # annotations land on the index, and ghcr reads the index. Without
          # this the package shows nothing and does not link to the repo.
          annotations: ${{ steps.meta.outputs.annotations }}
          # Provenance stays: it rides in the index, travels with the image, and
          # is what the "annotations landed" check reads back. The SBOM does not:
          # syft generates one below that is signed, pushed as a referrer, and
          # attached to the release -- one SBOM, not a second unsigned one here.
          provenance: mode=max
          # Without this every run recompiles the whole module from source.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature is bound to this workflow's OIDC identity and
      # recorded in the public transparency log, so there is no key to store
      # and none to leak.
      - name: Sign the image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Signing can succeed and still leave something nobody can verify: the
      # wrong identity, the wrong issuer, a transparency log entry that never
      # landed. Reading it back is what makes the signature evidence rather
      # than a step that ran.
      - name: Verify the signature
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null

      # syft reads the pushed image and writes an SPDX inventory of everything
      # in it. This is the one SBOM: signed just below, pushed to the registry
      # as a referrer, and attached to the release for anyone who wants it
      # without pulling the image.
      - name: Generate the SBOM with syft
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # The release step attaches it deliberately; the default workflow
          # artifact upload would only duplicate that.
          upload-artifact: false

      # BuildKit's in-index provenance is unsigned. This mints a SLSA provenance
      # attestation signed against the workflow's OIDC identity, recorded in the
      # public transparency log, and pushed beside the image as a referrer -- so
      # it verifies with `gh attestation verify`, no Rekor spelunking required.
      - name: Attest the build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Same treatment for the SBOM: a signed attestation binds the syft
      # inventory to this exact image digest, so a consumer can trust the
      # inventory the way they trust the signature.
      - name: Attest the SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      # Attesting can succeed and still leave something nobody can verify, the
      # same way signing can. Read both attestations back against the digest --
      # provenance by default, the SBOM by its predicate type -- so the run
      # fails here rather than shipping an attestation that does not check out.
      - name: Verify the attestations
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" > /dev/null
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document > /dev/null

      # Reads back what actually landed rather than trusting that it did.
      # source is the one that matters: without it the package is orphaned in
      # ghcr and its permissions do not inherit from the repository.
      - name: Verify the annotations landed
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          raw=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw)

          echo "$raw" | jq -e '.annotations["org.opencontainers.image.source"]' > /dev/null \
            || { echo "::error::index carries no image.source annotation; the package will not link to the repository"; exit 1; }

          # provenance and sbom ride as an attestation manifest beside the
          # image. No attestation manifest means those settings silently did
          # nothing, and the index would be a plain single-image index.
          echo "$raw" | jq -e '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length > 0' > /dev/null \
            || { echo "::error::no attestation manifest in the index; provenance and sbom did not attach"; exit 1; }

      # The release is an announcement of an artifact, so it comes after the
      # artifact exists, is signed, and has been read back -- not before it is
      # built. Everything above can fail; nothing is announced if it does.
      - name: Build the installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: make build-installer IMG="ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "## Image"
            echo
            echo '```'
            echo "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
            echo '```'
            echo
            echo "Signed with cosign, keyless. Verify:"
            echo
            echo '```'
            echo "cosign verify ghcr.io/${GITHUB_REPOSITORY}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "Provenance and SBOM are signed attestations. Verify:"
            echo
            echo '```'
            echo "gh attestation verify oci://ghcr.io/${GITHUB_REPOSITORY}@${DIGEST} \\"
            echo "  --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "## SBOM"
            echo
            echo "\`sbom.spdx.json\` below inventories the published image (SPDX, generated by syft)."
            echo
            echo "## Install"
            echo
            echo '```'
            echo "kubectl apply -f https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/install.yaml"
            echo '```'
          } > /tmp/notes.md

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file /tmp/notes.md \
            --generate-notes \
            --verify-tag \
            dist/install.yaml \
            sbom.spdx.json
